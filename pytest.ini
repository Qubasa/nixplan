[pytest]
# -rs: an artifact-backed suite under tests/e2e skips itself when its PLANNER_
# variable names no built path, and the skip reason is the only thing that tells
# that apart from a run with nothing to say.
addopts = -rs

# workdirs/ holds nested checkouts of this same tree, so collecting it gives two
# files named test_harness.py and pytest refuses the second as an import mismatch.
# The defaults are restated because naming this key replaces them.
norecursedirs = workdirs *.egg .* _darcs build CVS dist node_modules venv {arch}
