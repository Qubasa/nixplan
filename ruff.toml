# This repository owns no python package, so there is no pyproject for ruff to read.
# src names the directories a module is imported from, so first-party imports
# sort the way they resolve at run time.
src = ["cli", "perf", "tests/e2e"]
line-length = 100
# A floor, not the interpreter: pytest-env.nix builds nixpkgs' default python3,
# which is newer, so UP may only rewrite to syntax 3.13 already accepts.
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
# The plan is decoded JSON, so dict[str, Any] crosses the harness.
ignore = ["ANN401"]
